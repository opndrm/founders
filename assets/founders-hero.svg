<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520" role="img" aria-labelledby="title desc">
  <title id="title">OPNDRM Founders Workflow</title>
  <desc id="desc">A black terminal-inspired banner showing one App connected to Auditor, JCode, and Gate spaces.</desc>
  <defs>
    <linearGradient id="glow" x1="0" x2="1">
      <stop offset="0" stop-color="#00bcd4"/>
      <stop offset="0.55" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#ff69b4"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="45%" r="60%">
      <stop offset="0" stop-color="#00bcd4" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <rect width="1400" height="520" rx="28" fill="#000000"/>
  <rect x="1" y="1" width="1398" height="518" rx="27" fill="none" stroke="#242424" stroke-width="2"/>
  <ellipse cx="700" cy="250" rx="520" ry="225" fill="url(#halo)"/>
  <path d="M260 374H1140" stroke="url(#glow)" stroke-width="3" opacity="0.65" filter="url(#soft)"/>
  <path d="M260 374H1140" stroke="url(#glow)" stroke-width="2" opacity="0.9"/>

  <text x="610" y="90" fill="#00bcd4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" font-weight="700" letter-spacing="7">OPNDRM</text>
  <text x="370" y="165" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="58" font-weight="700">FOUNDERS WORKFLOW</text>
  <text x="470" y="213" fill="#9ca3af" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22">one command · three spaces · one App</text>

  <g transform="translate(70 270)">
    <rect width="360" height="122" rx="14" fill="#080808" stroke="#242424" stroke-width="2"/>
    <circle cx="28" cy="30" r="7" fill="#00d900"/>
    <text x="48" y="38" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" font-weight="700">APP — AUDITOR</text>
    <text x="28" y="76" fill="#00bcd4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">SSS / Pi · read only</text>
    <text x="28" y="104" fill="#6b7280" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">localhost:4600</text>
  </g>

  <g transform="translate(520 270)">
    <rect width="360" height="122" rx="14" fill="#111111" stroke="#00bcd4" stroke-width="2"/>
    <circle cx="28" cy="30" r="7" fill="#00bcd4"/>
    <text x="48" y="38" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" font-weight="700">APP — JCODE</text>
    <text x="28" y="76" fill="#ff69b4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">DeepSeek Flash Cloud</text>
    <text x="28" y="104" fill="#6b7280" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">Desktop/App</text>
  </g>

  <g transform="translate(970 270)">
    <rect width="360" height="122" rx="14" fill="#080808" stroke="#242424" stroke-width="2"/>
    <circle cx="28" cy="30" r="7" fill="#fbbf24"/>
    <text x="48" y="38" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" font-weight="700">APP — GATE</text>
    <text x="28" y="76" fill="#fbbf24" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">No Mistakes · waiting</text>
    <text x="28" y="104" fill="#6b7280" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">JCode-owned run</text>
  </g>

  <text x="465" y="460" fill="#6b7280" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">HERDR · OLLAMA · PORTABLE SKILLS · VISIBLE RECEIPTS</text>
</svg>
